services:
  storm:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${STORM_HOST_BIND:-127.0.0.1}:${STORM_HOST_PORT:-8501}:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      pangolin:
        ipv4_address: "${STORM_PANGOLIN_IP:?STORM_PANGOLIN_IP must be set}"
    volumes:
      - storm-articles:/app/frontend/demo_light/DEMO_WORKING_DIR
      - storm-vector-data:/data/vector_store
    restart: unless-stopped

networks:
  pangolin:
    name: pangolin
    external: true

volumes:
  storm-articles:
  storm-vector-data:
